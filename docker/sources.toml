schema_version = 1
baseline = "hf-main"
# Ordinary cargo --release builds; no target-cpu=native or custom Rust flags.
# Each ref is resolved once at image build time; the image retains exact SHAs,
# source snapshots, generated runner locks and compiler provenance.

