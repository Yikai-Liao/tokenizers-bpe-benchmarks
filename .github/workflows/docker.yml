name: Build benchmark Docker image

on:
  workflow_dispatch:
    inputs:
      sources_config:
        description: Source manifest in this repository (TOML)
        default: docker/sources.toml
        required: true
        type: string
      image_tag:
        description: GHCR tag (also published with a unique run tag)
        default: latest
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate inputs and choose image name
        id: names
        env:
          SOURCE_CONFIG: ${{ inputs.sources_config }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          source = Path(os.environ['SOURCE_CONFIG'])
          root = Path.cwd().resolve()
          source.resolve().relative_to(root / 'docker')
          if not source.is_file() or source.suffix != '.toml':
              raise ValueError('sources_config must be an existing docker/*.toml')
          tag = os.environ['IMAGE_TAG']
          if not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}', tag):
              raise ValueError('invalid image tag')
          image = 'ghcr.io/' + os.environ['REPOSITORY'].lower()
          unique = f"run-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'image={image}\ntag={tag}\nunique={unique}\n')
          PY
      - name: Build all source revisions
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          # Resolve main and PR refs on every manual build, even with a layer cache.
          no-cache-filters: builder
          build-args: |
            SOURCES_CONFIG=${{ inputs.sources_config }}
            BUILD_JOBS=2
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.unique }}
      - name: Test the image before publishing
        env:
          IMAGE: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.unique }}
        run: |
          # Private hosted runners may expose two SMT siblings of one core.
          mkdir -p .bench/docker-smoke
          docker run --rm --network none \
            --mount type=bind,src="$PWD/.bench/docker-smoke",dst=/smoke \
            --entrypoint python "$IMAGE" /opt/benchmark/scripts/docker_smoke.py \
            --out /smoke --workers 1
          docker run --rm --network none --cpus 1 --cpuset-cpus 0 \
            --mount type=bind,src="$PWD/.bench/docker-smoke/data",dst=/data,readonly \
            --mount type=bind,src="$PWD/.bench/docker-smoke/config",dst=/config,readonly \
            --mount type=bind,src="$PWD/.bench/docker-smoke/results",dst=/results \
            "$IMAGE"
          test -s .bench/docker-smoke/results/report/core-scaling.png
          test -s .bench/docker-smoke/results/report/small-core-scaling.png
          test -s .bench/docker-smoke/results/report/memory-growth.png
          docker run --rm --network none --entrypoint cat "$IMAGE" /opt/builds/bundle.json > .bench/docker-smoke/bundle.json
          docker run --rm --network none --entrypoint python "$IMAGE" \
            /opt/benchmark/tests/test_corpora.py
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
          UNIQUE: ${{ steps.names.outputs.unique }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:$UNIQUE"
          {
            echo '### Benchmark image'
            echo "\`$IMAGE:$UNIQUE\`"
            echo 'Four resolved source commits are retained in bundle.json and the validation artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bench/docker-smoke/bundle.json
            .bench/docker-smoke/config
            .bench/docker-smoke/data
            .bench/docker-smoke/results
          if-no-files-found: ignore
