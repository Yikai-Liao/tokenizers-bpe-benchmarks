[project]
name = "tokenizers-bpe-benchmarks"
version = "0.1.0"
requires-python = ">=3.11.8"
description = "Reproducible paired BPE core and public pipeline measurements"
[project.optional-dependencies]
corpus = ["pyarrow>=17"]
plots = ["matplotlib>=3.9,<4", "PyMuPDF>=1.24,<2"]
[project.scripts]
bpe-bench = "bench.__main__:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["bench"]
