schema_version = 1
# Recommended target: up to 4 GiB per corpus. Source exhaustion
# retains a smaller corpus and is reported; this does not predict a 16 GiB RSS.
size_mib = 4096

[[corpora]]
name = "en"
dataset = "wikipedia-en.json"

[[corpora]]
name = "zh"
dataset = "wikipedia-zh.json"

[[corpora]]
name = "code"
dataset = "github-code-clean.json"
